<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#030712" stroke="#00f0ff" stroke-width="2" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 4" opacity="0.8" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#glow)" />
  <!-- Coils -->
  <g stroke="#00f0ff" stroke-width="3" opacity="0.9">
    <line x1="50" y1="12" x2="50" y2="24" />
    <line x1="50" y1="76" x2="50" y2="88" />
    <line x1="12" y1="50" x2="24" y2="50" />
    <line x1="76" y1="50" x2="88" y2="50" />
    <line x1="23" y1="23" x2="32" y2="32" />
    <line x1="68" y1="68" x2="77" y2="77" />
    <line x1="23" y1="77" x2="32" y2="68" />
    <line x1="68" y1="32" x2="77" y2="23" />
  </g>
  <polygon points="50,26 68,60 32,60" fill="none" stroke="#00f0ff" stroke-width="2" />
  <circle cx="50" cy="48" r="14" fill="url(#arcGlow)" filter="url(#glow)" />
</svg>
